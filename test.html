<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      background: transparent; /* Transparent background for OBS */
      overflow: hidden;
    }
    #avatar {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
    }
    .hammer {
      position: absolute;
      top: -200px; /* start off screen */
      left: 50%;
      transform: translateX(-50%) rotate(-30deg);
      transition: top 0.5s ease-out, transform 0.5s ease-out;
    }
    .hammer.hit {
      top: 200px; /* fall down */
      transform: translateX(-50%) rotate(10deg);
    }
  </style>
</head>
<body>
  <img id="avatar" src="avatar.png" height="400">
  <img id="hammer" class="hammer" src="hammer.png" height="200">
  
  <script>
    function playBonk() {
      const hammer = document.getElementById("hammer");
      hammer.classList.add("hit");

      // Screen shake effect
      const avatar = document.getElementById("avatar");
      avatar.animate([
        { transform: 'translateX(-50%) translateY(0)' },
        { transform: 'translateX(-50%) translateY(-20px)' },
        { transform: 'translateX(-50%) translateY(0)' }
      ], { duration: 300, iterations: 2 });

      // Reset hammer after 1s
      setTimeout(() => hammer.classList.remove("hit"), 1000);
    }

    // Example trigger (pretend Bits came in)
    setTimeout(playBonk, 2000);
  </script>
</body>
</html>
